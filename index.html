<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウパ教 - ウーパールーパー愛好団体</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ヘッダー -->
    <header class="header">
        <div class="header-container">
            <div class="logo-section">
                <img src="logo.png" alt="ウパ教ロゴ" class="logo" placeholder="ここにロゴを挿入してください">
                <h1 class="site-title">ウパ教</h1>
            </div>
            <nav class="nav">
                <ul class="nav-list">
                    <li><a href="#about">団体紹介</a></li>
                    <li><a href="#news">ニュース</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">
        <!-- 団体紹介セクション -->
        <section id="about" class="about-section">
            <div class="about-container">
                <h2 class="section-title">ウパ教について</h2>
                <div class="about-content">
                    <div class="about-image">
                        <img src="about-image.jpg" alt="ウパ教の紹介画像" class="about-img" placeholder="ここに紹介画像を挿入してください">
                    </div>
                    <div class="about-text">
                        <p class="about-description">
                            <!-- ここに団体紹介文を挿入してください -->
                            ウパ教の紹介文をここに挿入してください。
                        </p>
                        <p class="about-description">
                            ウーパールーパーの魅力や、団体の活動内容などを自由に記入できます。
                        </p>
                    </div>
                </div>
            </div>
        </section>

        <!-- ニュースセクション -->
        <section id="news" class="news-section">
            <div class="news-container">
                <h2 class="section-title">ウーパールーパーニュース</h2>
                <div class="news-grid">
                    <!-- ニュース記事1 -->
                    <article class="news-card">
                        <div class="news-image">
                            <img src="news1.jpg" alt="ニュース1" class="news-img" placeholder="ニュース画像を挿入">
                        </div>
                        <div class="news-content">
                            <h3 class="news-title">ニュースタイトル1</h3>
                            <p class="news-date">2026年6月7日</p>
                            <p class="news-text">
                                ニュース記事の内容をここに挿入してください。
                            </p>
                        </div>
                    </article>

                    <!-- ニュース記事2 -->
                    <article class="news-card">
                        <div class="news-image">
                            <img src="news2.jpg" alt="ニュース2" class="news-img" placeholder="ニュース画像を挿入">
                        </div>
                        <div class="news-content">
                            <h3 class="news-title">ニュースタイトル2</h3>
                            <p class="news-date">2026年6月1日</p>
                            <p class="news-text">
                                ニュース記事の内容をここに挿入してください。
                            </p>
                        </div>
                    </article>

                    <!-- ニュース記事3 -->
                    <article class="news-card">
                        <div class="news-image">
                            <img src="news3.jpg" alt="ニュース3" class="news-img" placeholder="ニュース画像を挿入">
                        </div>
                        <div class="news-content">
                            <h3 class="news-title">ニュースタイトル3</h3>
                            <p class="news-date">2026年5月25日</p>
                            <p class="news-text">
                                ニュース記事の内容をここに挿入してください。
                            </p>
                        </div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <!-- フッター -->
    <footer class="footer">
        <div class="footer-container">
            <p>&copy; 2026 ウパ教. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
